name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    environment: Production
    name: Typecheck and Register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
      - uses: oven-sh/setup-bun@v2
        name: Set up bun
        with:
          bun-version-file: '.bun-version'
      - name: Install dependencies
        run: bun ci
      - run: bun run lint
        name: Lint
        continue-on-error: true
      - run: bun run type-check
        name: Typecheck
      - run: |
          bun run register
        name: Register
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
  docker:
    name: Push to Docker
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
      - name: Set up Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            gavenda/vivy
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - uses: docker/setup-buildx-action@v4
        name: Set up Docker Buildx
      - uses: docker/login-action@v4
        name: Login to DockerHub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        name: Build and push
        with:
          file: ./Dockerfile
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: 'linux/amd64,linux/arm64'
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tells Podman on the server to pull the new :latest and restart the service.
  # The deploy key only runs `podman auto-update` (forced command in authorized_keys),
  # and Podman rolls back on its own if the new container fails to start.
  deploy:
    name: Deploy
    needs: docker
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Roll out on server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes vivy@"$HOST"
